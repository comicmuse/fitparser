name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for mobile app changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  flutter-test:
    name: Flutter Tests
    # Format, analyze and unit-test the mobile app — skipped when nothing
    # under mobile/ changed. Re-enabled after the flutter_tester segfault
    # (#44) stopped reproducing; the timeout guards against a recurrence.
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        timeout-minutes: 10
        run: flutter test

  flutter-build:
    name: Flutter Build APK
    # Compile check for the mobile app — skipped when nothing under mobile/ changed.
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Create dummy google-services.json for CI build
        run: |
          cat > mobile/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "runcoach-ci",
              "storage_bucket": "runcoach-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.runcoach.mobile"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "placeholder"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=BASE_URL=http://localhost:5001/api/v1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: runcoach-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  flutter-release:
    name: Flutter Release APK
    # Installable build pointed at the production server. Runs on pushes to
    # main that change the mobile app, and on every manual run. PRs are
    # covered by the debug build above.
    # Never publish an APK whose tests fail.
    needs: [changes, flutter-test]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the mobile-latest GitHub Release
    # Never run two releases at once — they'd race replacing mobile-latest.
    concurrency:
      group: mobile-release
      cancel-in-progress: false
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Release APK skipped::Missing repository secrets:$missing. See docs/mobile-release.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.secrets.outputs.configured == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write google-services.json
        if: steps.secrets.outputs.configured == 'true'
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          else
            echo "::warning title=No Firebase config::GOOGLE_SERVICES_JSON secret not set — push notifications will not work in this APK."
            cat > mobile/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "runcoach-ci",
              "storage_bucket": "runcoach-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.runcoach.mobile"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "placeholder"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Write release keystore
        if: steps.secrets.outputs.configured == 'true'
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > mobile/android/key.properties << EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        if: steps.secrets.outputs.configured == 'true'
        working-directory: mobile
        # build-number = CI run number, so every build has a higher
        # versionCode and installs as an update over the previous one.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        if: steps.secrets.outputs.configured == 'true'
        id: apk
        run: |
          version=$(grep '^version:' mobile/pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          name="runcoach-${version}-${{ github.run_number }}.apk"
          mv mobile/build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release APK :iphone:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$name\` (versionCode ${{ github.run_number }}) — download from the **runcoach-release-apk** artifact below." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runcoach-release-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 90
          if-no-files-found: error

      - name: Publish mobile-latest GitHub Release
        if: steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          # Fixed asset name so the download link never changes:
          # https://github.com/${{ github.repository }}/releases/download/mobile-latest/runcoach.apk
          cp "$APK" runcoach.apk
          notes="Latest mobile build: \`$APK\` (versionCode ${{ github.run_number }}) from ${{ github.sha }}.

          Built by [CI run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). This release is replaced on every mobile build."
          # Replace the previous release and move the tag to this commit.
          gh release delete mobile-latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create mobile-latest runcoach.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mobile latest (${{ steps.apk.outputs.version }}+${{ github.run_number }})" \
            --notes "$notes" \
            --latest=false
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/mobile-latest/runcoach.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always() && steps.secrets.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks" mobile/android/key.properties

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fcm,claude]"

      - name: Run tests with coverage
        run: |
          pytest --cov=runcoach --cov-report=xml --cov-report=term --ignore=tests/e2e

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  e2e:
    name: E2E Browser Tests
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run E2E tests
        env:
          RUNCOACH_PASSWORD: "testpassword123"
        run: |
          pytest tests/e2e/ -m e2e --no-cov -v --tb=short --tracing=retain-on-failure

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker-smoke-test:
    name: Docker Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: runcoach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify optional dependencies are installed in image
        run: |
          docker run --rm runcoach:ci python -c "import firebase_admin; import anthropic; print('OK')"

      - name: Start container
        run: |
          docker run -d \
            --name runcoach-smoke \
            -p 5000:5000 \
            -e SECRET_KEY="ci-test-secret-key-not-for-production" \
            -e DATA_DIR=/tmp/data \
            -e FLASK_PORT=5000 \
            runcoach:ci

      - name: Verify /status responds on port 5000
        run: |
          echo "Waiting for /status to respond..."
          timeout 60 bash -c 'until curl -sf http://localhost:5000/status; do sleep 1; done' || {
            echo "/status never responded. Container logs:"
            docker logs runcoach-smoke
            exit 1
          }
          echo "/status is up"

      - name: Check container logs for errors
        run: |
          errors=$(docker logs runcoach-smoke 2>&1 | grep "ERROR" || true)
          if [ -n "$errors" ]; then
            echo "ERROR lines found in container logs:"
            echo "$errors"
            exit 1
          fi
          echo "No errors in container logs"

      - name: Stop container
        if: always()
        run: |
          docker stop runcoach-smoke || true
          docker rm runcoach-smoke || true

  build-and-deploy:
    name: Build and Push Docker Image
    needs: [test, docker-smoke-test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ghcr.io/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
